<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>تم تسجيل طلبك بنجاح | بروبيلاكس جيل</title>
    <meta name="description" content="تم تسجيل طلبك بنجاح لمنتج ستريك جيل. سيقوم ممثل خدمة العملاء بالتواصل معك قريباً لتأكيد الطلب." />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#f58f1a" />

    <link rel="shortcut icon" href="images/mark.webp" type="image/x-icon" />

    <style>
      @font-face {
        font-family: mainFont;
        src: local("mainFont"), url("css/mainFont.ttf");
      }
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        direction: rtl;
      }
      body,
      html {
        font-family: mainFont, sans-serif;
      }
      a {
        text-decoration: none;
      }
      img {
        width: 100%;
        display: block;
      }
      .div_btn {
        text-align: center;
      }
      .div_btn .btn {
        font-family: mainFont, sans-serif;
        font-size: 24px;
        padding: 1px 38px 5px;
        line-height: 1.5;
        color: #fff;
        border-radius: 20px;
        box-shadow: 0 5px 15px #5858586b;
        cursor: pointer;
        line-height: 1;
      }
      .div_btn .btn span {
        color: #d5d5d5;
      }

      /* Start Thanks Page Section */
      body.thanks_page_page {
        background: url(images/thanks-2.webp) center/cover;
        min-height: 100vh;
      }
      .thanks_page {
        text-align: center;
        padding-top: 30px;
      }
      .thanks_page h3 {
        font-size: 21px;
        color: #fcfefe;
        background: linear-gradient(#26703A, #45C752);
        width: max-content;
        margin: 0 auto;
        border-radius: 10px;
        padding: 0px 11px 2px 30px;
        text-align: center;
      }
      .thanks_page p {
        font-size: 14px;
        color: #fcfefe;
        background: linear-gradient(#2a2a2a, #141414);
        width: max-content;
        margin: 0 auto 15px;
        padding: 1px 8px 3px 35px;
        border-radius: 10px;
      }
      .thanks_page .text {
        position: relative;
        width: max-content;
        margin: 0 auto;
      }
      .thanks_page .div_btn {
        margin-top: 35px;
      }
      .thanks_page .div_btn a {
        background: linear-gradient(00deg, #F5671A , #F7A81F);
      }
      .thanks_page .text .img_check {
        position: absolute;
        top: 50%;
        left: -45px;
        transform: translateY(-50%);
        width: 75px;
        text-align: center;
      }
      /* ==========  Responsive Design  ========== */
      @media (min-width: 600px) {
        body.thanks_page_page {
          background: #313131;
          min-height: 100vh;
        }
      }

      @media (min-width: 992px) {
        .thanks_page p {
          font-size: 18px;
          margin-bottom: 25px;
        }

        .thanks_page h3 {
          font-size: 25px;
          margin: 0px auto 8px;
        }

        .thanks_page .text img {
          width: 100px;
        }
      }
    </style>
  </head>

  <body class="thanks_page_page">
    <div class="thanks_page">
      <div class="text">
        <img class="img_check" src="images/mark.webp" alt="تم تسجيل طلب ستريك جيل بنجاح" />
        <h3>تم تسجيل طلبكم للمنتج بنجاح</h3>
        <p>سيقوم احد ممثلي خدمة العملاء بالتواصل معك</p>
      </div>
      <div class="div_btn">
        <a href="index.html" class="btn">الرجوع للموقع</a>
      </div>
    </div>
  </body>
</html>
